# ==============================================================================
# EduNotes — Netlify Deployment Configuration
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Routing endpoint AI ke Netlify Functions (harus di atas SPA fallback)
[[redirects]]
  from = "/api/ai/status"
  to = "/.netlify/functions/ai-status"
  status = 200

[[redirects]]
  from = "/api/ai/analyze"
  to = "/.netlify/functions/ai-analyze"
  status = 200

# SPA fallback agar refresh pada halaman internal tidak menghasilkan 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
